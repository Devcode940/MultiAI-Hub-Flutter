name: multiai_hub
description: MultiAI Hub - Access 30+ AI platforms from a single app
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0

  # State Management
  provider: ^6.1.2

  # WebView
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1
  webview_flutter_wkwebview: ^3.9.4

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # Utilities
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2
  share_plus: ^7.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.3.3

  # Icons
  flutter_svg: ^2.0.10+1

  # Feature 4: Notifications
  flutter_local_notifications: ^17.1.2
  awesome_notifications: ^0.9.3

  # Feature 5: Onboarding
  introduction_screen: ^3.1.12

  # Feature 7: Voice Input
  speech_to_text: ^6.6.0

  # Feature 8: Caching & Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Feature 9: Deep Linking
  app_links: ^4.0.0
  uni_links: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
